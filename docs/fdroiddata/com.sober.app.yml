# Ready-to-submit F-Droid recipe. Copy to fdroiddata as
# metadata/com.sober.app.yml; see docs/DISTRIBUTION.md for the submission steps.
Categories:
  - System
License: MIT
AuthorName: Rishabh
SourceCode: https://github.com/rishabhx29/Sober
IssueTracker: https://github.com/rishabhx29/Sober/issues
Changelog: https://github.com/rishabhx29/Sober/releases

AutoName: Sober
Summary: Private, offline screen-time limits and focus sessions
Description: |-
  Sober is a calm, on-device screen-time blocker: per-app daily limits, one
  budget for the whole phone, timed focus sessions, section blocking for Reels
  and Shorts, and website blocking inside the browser.

  Everything runs locally. There is no account, no cloud, no analytics, and the
  app does not request the internet permission.

RepoType: git
Repo: https://github.com/rishabhx29/Sober.git

Builds:
  - versionName: '1.3'
    versionCode: 4
    commit: v1.3
    subdir: app
    gradle:
      - "yes"
    output: app/build/outputs/apk/release/app-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: '1.3'
CurrentVersionCode: 4
