<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="brand.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      #root {
        width: 1080px;
        height: 1920px;
      }

      #end-card {
        width: 1080px;
        height: 1920px;
        position: relative;
        background: var(--ground);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      #icon-wrap {
        width: 260px;
        height: 260px;
        margin-bottom: 64px;
        position: relative;
      }

      #icon {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 58px;
      }

      #wordmark {
        display: flex;
        align-items: baseline;
        gap: 10px;
        color: var(--text);
        font-size: 116px;
        font-weight: 600;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      #wordmark .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--signal);
        transform: translateY(-6px);
      }

      #tagline {
        margin-top: 30px;
        color: var(--text-secondary);
        font-size: 40px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.3;
      }

      #proof {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 170px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      #rule {
        width: 520px;
        height: 1px;
        background: var(--hairline);
        margin-bottom: 18px;
      }

      .proof-line {
        font-family: var(--font-mono);
        font-size: 28px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--text-muted);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="4"
      data-width="1080"
      data-height="1920"
    >
      <div id="end-card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="icon-wrap">
          <img id="icon" src="assets/icon.png" alt="Sober" />
        </div>
        <div id="wordmark">Sober<span class="dot"></span></div>
        <div id="tagline">Less screen. More life.</div>
        <div id="proof">
          <div id="rule"></div>
          <div class="proof-line">Free · Open source</div>
          <div class="proof-line">No internet permission</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        "#icon",
        { scale: 1.06, filter: "blur(6px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.65, ease: "power3.out" },
        0
      )
        .fromTo(
          "#wordmark",
          { opacity: 0, y: 26, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power4.out" },
          0.3
        )
        .fromTo(
          "#tagline",
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          0.55
        )
        .fromTo("#rule", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.75)
        .fromTo(
          ".proof-line",
          { opacity: 0, y: 8 },
          { opacity: 1, y: 0, duration: 0.4, stagger: 0.1, ease: "power2.out" },
          1.0
        );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
